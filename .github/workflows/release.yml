name: release

# Build single-file executables for Windows, macOS, and Linux
# and attach them (+ SHA-256) to a GitHub Release.
# Trigger: push a version tag, e.g. git tag v0.4.0 && git push --tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # The TAG is the source of truth. Instead of failing when the tagged
      # commit has a stale __version__, sync the version files to the tag so
      # the build/exe properties always match the release you pushed.
      - name: Sync version files to tag (on tag push)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG="${TAG#v}"
          echo "release version: $TAG"
          TAG="$TAG" python - <<'EOF'
          import os, re, pathlib
          tag = os.environ["TAG"]
          init = pathlib.Path("zcode_gateway/__init__.py")
          src = init.read_text(encoding="utf-8")
          src, n1 = re.subn(r'__version__ = "[^"]+"', f'__version__ = "{tag}"', src)
          assert n1 == 1, "no __version__ line in zcode_gateway/__init__.py"
          init.write_text(src, encoding="utf-8")

          ver = pathlib.Path("tools/exe_version.txt")
          if ver.is_file():
              s = ver.read_text(encoding="utf-8")
              parts = (tag.split(".") + ["0", "0", "0"])[:3]
              quad = f"({parts[0]}, {parts[1]}, {parts[2]}, 0)"
              dotted = f"{parts[0]}.{parts[1]}.{parts[2]}.0"
              s = re.sub(r"\(\d+, \d+, \d+, 0\)", quad, s)
              s = re.sub(r"\d+\.\d+\.\d+\.0", dotted, s)
              ver.write_text(s, encoding="utf-8")
          print("version files synced to", tag)
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  build:
    name: build (${{ matrix.asset_name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ZcodeGateway.exe
          - os: macos-latest
            asset_name: ZcodeGateway-macos
          - os: ubuntu-latest
            asset_name: ZcodeGateway-linux

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python build.py --clean --name ${{ matrix.asset_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate unified checksums.sha256
        working-directory: dist
        run: |
          chmod +x ZcodeGateway-macos ZcodeGateway-linux || true
          sha256sum ZcodeGateway.exe ZcodeGateway-macos ZcodeGateway-linux > checksums.sha256
          cat checksums.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZcodeGateway.exe
            dist/ZcodeGateway-macos
            dist/ZcodeGateway-linux
            dist/checksums.sha256
          generate_release_notes: true
