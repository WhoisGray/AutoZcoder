name: ci

# Fast test gate on every push/PR to main: catches breakage BEFORE it lands
# in a tagged release. Tests Windows, macOS, and Linux.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Syntax check generator package
        run: |
          python -m py_compile generator/main.py generator/invite_claim.py generator/captcha_solver.py generator/proxy_pool.py generator/fingerprint.py generator/claim100.py

  rewrite:
    name: rewrite node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Coordinator, protocol, pool, and gateway tests
        run: npm test
